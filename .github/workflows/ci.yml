name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Dummy URLs so `prisma generate` works without a live DB
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/calendo?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/calendo?schema=public

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx next build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/calendo?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/calendo?schema=public
          NEXTAUTH_SECRET: ci-build-placeholder-secret
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
